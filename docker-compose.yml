version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kiranalink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kirana_link
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kiranalink-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiranalink-backend
    restart: on-failure
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: kirana_link
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: smart_dukaan_super_secure_jwt_secret_key_1234567890_kiranalink
      DEMO_MODE: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kiranalink-net

volumes:
  mysql_data:

networks:
  kiranalink-net:
    driver: bridge
